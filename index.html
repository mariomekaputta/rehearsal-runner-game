<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Lari Bulat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <header class="hud">
      <span class="title">LARI BULAT</span>
      <span class="scores">
        <span>TERBAIK <b id="best">00000</b></span>
        <span><b id="score">00000</b></span>
      </span>
    </header>

    <div class="stage" id="stage">
      <canvas id="game" aria-label="Area permainan"></canvas>

      <div class="overlay" id="startScreen">
        <p class="big">Siap lari?</p>
        <p class="hint">Tekan <kbd>Spasi</kbd>, klik, atau ketuk layar untuk mulai &amp; lompat.<br>Tahan lebih lama untuk lompat lebih tinggi.</p>
      </div>

      <div class="overlay hidden" id="overScreen">
        <p class="big">GAME OVER</p>
        <p class="final">Skor <b id="finalScore">0</b></p>
        <p class="newbest hidden" id="newBest">Rekor baru!</p>
        <button type="button" id="restartBtn">Main Lagi</button>
      </div>
    </div>

    <p class="foot">Spasi / ↑ / klik / ketuk = lompat · P = jeda</p>
  </main>

  <script src="game.js"></script>
</body>
</html>
